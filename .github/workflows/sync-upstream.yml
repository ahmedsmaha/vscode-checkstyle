name: Sync and Publish Upstream Release

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the latest upstream release even if the version is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  workflows: write

env:
  UPSTREAM_REPO: jdneo/vscode-checkstyle
  PUBLISHER: ahmedsmaha

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Could not determine latest upstream release."
            exit 1
          fi

          echo "Latest upstream release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          LATEST_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const latestTag = process.env.LATEST_TAG;
          const current = process.env.CURRENT_VERSION;
          const forcePublish = process.env.FORCE_PUBLISH === "true";

          const latest = latestTag.replace(/^v/, "");

          function parseVersion(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)/);

            if (!match) {
              throw new Error(`Invalid version: ${version}`);
            }

            return [
              Number(match[1]),
              Number(match[2]),
              Number(match[3])
            ];
          }

          function compareVersions(a, b) {
            const av = parseVersion(a);
            const bv = parseVersion(b);

            for (let i = 0; i < 3; i++) {
              if (av[i] > bv[i]) return 1;
              if (av[i] < bv[i]) return -1;
            }

            return 0;
          }

          console.log(`Current version:  ${current}`);
          console.log(`Upstream version: ${latest}`);
          console.log(`Force publish:    ${forcePublish}`);

          const isNewer = compareVersions(latest, current) > 0;

          if (forcePublish || isNewer) {
            console.log("A publish is required.");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "update=true\n"
            );
          } else {
            console.log("No newer upstream release.");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "update=false\n"
            );
          }
          EOF

      - name: Fetch upstream
        if: steps.compare.outputs.update == 'true'
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          git fetch upstream --tags --force

      - name: Reset to upstream release
        if: steps.compare.outputs.update == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          git checkout -B sync-upstream "$TAG"

          echo "Checked out upstream release: $TAG"

      - name: Set our publisher
        if: steps.compare.outputs.update == 'true'
        env:
          PUBLISHER: ${{ env.PUBLISHER }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          console.log(`Original publisher: ${pkg.publisher}`);
          console.log(`New publisher:      ${process.env.PUBLISHER}`);

          pkg.publisher = process.env.PUBLISHER;

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          EOF

      - name: Verify package metadata
        if: steps.compare.outputs.update == 'true'
        env:
          EXPECTED_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_PUBLISHER: ${{ env.PUBLISHER }}
        run: |
          EXPECTED_VERSION="${EXPECTED_TAG#v}"

          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          ACTUAL_PUBLISHER=$(node -p "require('./package.json').publisher")

          echo "Expected version:   $EXPECTED_VERSION"
          echo "Actual version:     $ACTUAL_VERSION"
          echo "Expected publisher: $EXPECTED_PUBLISHER"
          echo "Actual publisher:   $ACTUAL_PUBLISHER"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

          if [ "$ACTUAL_PUBLISHER" != "$EXPECTED_PUBLISHER" ]; then
            echo "Publisher mismatch!"
            exit 1
          fi

      - name: Setup Node.js
        if: steps.compare.outputs.update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Java 17
        if: steps.compare.outputs.update == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show build environment
        if: steps.compare.outputs.update == 'true'
        run: |
          echo "======================================"
          echo "Node"
          echo "======================================"
          node --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "Maven wrapper"
          echo "======================================"
          cat jdtls.ext/.mvn/wrapper/maven-wrapper.properties

          echo ""
          echo "======================================"
          echo "Tycho version"
          echo "======================================"
          grep "tycho-version" jdtls.ext/pom.xml

      - name: Install dependencies
        if: steps.compare.outputs.update == 'true'
        run: |
          npm ci

      - name: Lint
        if: steps.compare.outputs.update == 'true'
        run: |
          npm run lint

      - name: Pin JDT LS
        if: steps.compare.outputs.update == 'true'
        run: |
          sed -i \
            's#https://download.eclipse.org/jdtls/snapshots/repository/latest/#https://download.eclipse.org/jdtls/milestones/1.24.0/repository#' \
            jdtls.ext/com.shengchen.checkstyle.target/target.target

          echo "JDT LS repository:"
          grep "jdtls" jdtls.ext/com.shengchen.checkstyle.target/target.target

      - name: Build plugin
        if: steps.compare.outputs.update == 'true'
        run: |
          npm run build-plugin

      - name: Setup Node.js 22 for VSIX packaging
        if: steps.compare.outputs.update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        if: steps.compare.outputs.update == 'true'
        run: |
          npx @vscode/vsce package

      - name: Find VSIX
        if: steps.compare.outputs.update == 'true'
        id: vsix
        run: |
          VSIX_PATH=$(find . -maxdepth 1 -name "*.vsix" -type f | head -n 1)

          if [ -z "$VSIX_PATH" ]; then
            echo "VSIX was not generated."
            exit 1
          fi

          echo "Generated VSIX:"
          echo "$VSIX_PATH"

          echo "path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Install ovsx
        if: steps.compare.outputs.update == 'true'
        run: |
          npm install --no-save ovsx

      - name: Publish to Open VSX
        if: steps.compare.outputs.update == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not configured."
            exit 1
          fi

          echo "Publishing:"
          echo "${{ steps.vsix.outputs.path }}"

          npx ovsx publish \
            "${{ steps.vsix.outputs.path }}" \
            -p "$OVSX_PAT"

      - name: Commit synced source
        if: steps.compare.outputs.update == 'true'
        run: |
          git add -A

          git commit \
            -m "Sync upstream release ${{ steps.release.outputs.tag }}" \
            || echo "Nothing to commit."

      - name: Push synced branch
        if: steps.compare.outputs.update == 'true'
        run: |
          git push origin sync-upstream --force

      - name: Create Git tag
        if: steps.compare.outputs.update == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          echo "Creating tag: $TAG"

          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Create GitHub Release
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi