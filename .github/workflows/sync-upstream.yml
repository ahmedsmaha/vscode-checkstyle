name: Sync and Publish Upstream Release

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jdneo/vscode-checkstyle.git
          git fetch upstream --tags

      - name: Get latest upstream release
        id: release
        run: |
          LATEST_TAG=$(git tag \
            --sort=-version:refname \
            --list 'v*' \
            | head -n 1)

          echo "Latest upstream release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: current
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          node <<'EOF'
          const semver = require("semver");
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const latestTag = process.env.LATEST_TAG;
          const latest = latestTag.replace(/^v/, "");

          const current = pkg.version;

          console.log(`Current: ${current}`);
          console.log(`Upstream: ${latest}`);

          if (semver.gt(latest, current)) {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "update=true\n"
            );
          } else {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "update=false\n"
            );
          }
          EOF
        env:
          LATEST_TAG: ${{ steps.release.outputs.tag }}

      - name: Reset to upstream release
        if: steps.compare.outputs.update == 'true'
        run: |
          git checkout -B sync-upstream \
            "${{ steps.release.outputs.tag }}"

      - name: Set our publisher
        if: steps.compare.outputs.update == 'true'
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          pkg.publisher = process.env.PUBLISHER;

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          EOF
        env:
          PUBLISHER: ahmedsmaha

      - name: Install dependencies
        if: steps.compare.outputs.update == 'true'
        run: npm ci

      - name: Test
        if: steps.compare.outputs.update == 'true'
        run: npm test

      - name: Install ovsx
        if: steps.compare.outputs.update == 'true'
        run: npm install --no-save ovsx

      - name: Publish to Open VSX
        if: steps.compare.outputs.update == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish -p "$OVSX_PAT"

      - name: Create Git tag
        if: steps.compare.outputs.update == 'true'
        run: |
          VERSION="${{ steps.release.outputs.tag }}"

          git tag -f "$VERSION"
          git push origin "$VERSION" --force

      - name: Push synced branch
        if: steps.compare.outputs.update == 'true'
        run: |
          git push origin sync-upstream --force